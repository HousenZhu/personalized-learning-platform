name: AI Agent Quality

on:
  pull_request:
    paths:
      - "ai-agent/**"
      - ".github/workflows/ai-agent.yml"
  push:
    branches: [main, ZHS]
    paths:
      - "ai-agent/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: learning_platform
          POSTGRES_USER: coursepilot
          POSTGRES_PASSWORD: coursepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepilot -d learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ai-agent
    env:
      AGENT_INTERNAL_SECRET: test-secret-that-is-at-least-32-characters
      LLM_API_KEY: test-key
      DATABASE_URL: postgresql+asyncpg://coursepilot:coursepilot@localhost:5432/learning_platform
      CHECKPOINT_DATABASE_URL: postgresql://coursepilot:coursepilot@localhost:5432/learning_platform
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -e ".[dev]"
      - run: ruff check app tests evals
      - run: mypy app --ignore-missing-imports
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing
